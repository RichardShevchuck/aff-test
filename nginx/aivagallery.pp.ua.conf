root@test-vps24:/etc/nginx/conf.d# cat aivagallery.pp.ua.conf

server {
    server_name aivagallery.pp.ua www.aivagallery.pp.ua;

    root /var/www/aivagallery.pp.ua;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public" always;
    }

    location ~ /\. { deny all; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aivagallery.pp.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aivagallery.pp.ua/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}


server {
    if ($host = www.aivagallery.pp.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aivagallery.pp.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aivagallery.pp.ua www.aivagallery.pp.ua;
    return 404; # managed by Certbot




}

