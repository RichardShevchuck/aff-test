# /etc/nginx/sites-available/aivagallery.pp.ua


server {
    listen 80;
    listen [::]:80;
    server_name aivagallery.pp.ua www.aivagallery.pp.ua;

    root /var/www/aivagallery.pp.ua;
    index index.html;

  
    server_tokens off;

   
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json;

   
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
        # html не кэшируем, чтобы правки применялись сразу
        add_header Cache-Control "no-cache" always;
    }

    
    location ~* \.(css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public" always;
    }

  
    location ~ /\. { deny all; }
}
