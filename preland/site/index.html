<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Колесо бонусов</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1 class="hero__title">[Название команды / Тестовый оффер]</h1>
      <p class="hero__subtitle">Крути колесо и забирай приветственный бонус</p>
      <p class="hero__attempts">Попыток: <span id="attempts">2</span></p>
    </header>

    <section class="wheel">
      <div class="wheel__pointer" aria-hidden="true"></div>
      <canvas id="wheel" class="wheel__canvas" width="320" height="320" aria-label="Колесо фортуны"></canvas>
      <button id="spin" class="btn btn--spin" type="button">Крутить</button>
    </section>

    <p class="note">18+. Тестовая страница. Условия бонуса определяет оффер.</p>
    <p id="debug" class="debug" hidden></p>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <p class="modal__label">Ваш выигрыш</p>
      <h2 id="modal-title" class="modal__prize">100% + 50 FS</h2>
      <p class="modal__text">Бонус закреплён за вами. Зарегистрируйтесь, чтобы активировать его.</p>
      <a id="cta" class="btn btn--cta" href="#" data-offer>Забрать бонус</a>
    </div>
  </div>

  <script src="js/params.js"></script>
  <script src="js/wheel.js"></script>
</body>
</html>
